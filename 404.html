.lost__tag{font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;font-size:clamp(21px,3.1vw,32px);line-height:1.5;color:rgba(255,255,255,.82);max-width:600px;margin:0 auto;text-shadow:0 0 40px rgba(192,57,43,.25)}
.lost__signal{width:min(380px,84vw);margin:42px auto 0}
.lost__signal-row{display:flex;justify-content:space-between;align-items:baseline;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:11px}

pkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script><script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script><script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script><script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script><script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script><script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script><script src="main.js"></script><script>
(function(){
  // development meter: climbs, then drifts slightly — alive, but never a hard, disclosable figure
  var fill=document.getElementById('lost-fill'),pct=document.getElementById('lost-pct');
  function show(v){var n=Math.max(0,Math.min(99,Math.round(v)));fill.style.width=n+'%';pct.textContent=(n<10?'0':'')+n+'%';}
  var base=0,target=31;
  var climb=setInterval(function(){if(base<target){base+=Math.random()*4+1.5;show(base);}else{clearInterval(climb);}},120);
  setInterval(function(){show(target+(Math.random()*5-2.5));},1100);
  // manual back button — go to wherever you came from, else home
  var back=document.getElementById('lost-back');
  if(back)back.addEventListener('click',function(e){
    if(document.referrer&&document.referrer.indexOf(location.origin)===0){e.preventDefault();history.back();}
  });
})();
</script><div id="page-transition" aria-hidden="true"><div class="pt-panel pt-panel--top"></div><div class="pt-panel pt-panel--bot"></div></div></body></html>
